#### YOLO11N

# Input .pt or .onnx model path
model_path: /home/duykhongcay/hailo_ws/chess_pieces_detection/runs/chess_detection_yolo11n-3/weights/best.pt
# Model architecture identifier
model_name: "yolo11n"              
# Path to calibration images directory
calib_dir: /home/duykhongcay/hailo_ws/chess_pieces_detection/datasets/chess_pieces.v2-calib-version.yolov11/train/images
# Output directory for .har and .hef files 
output_dir: /home/duykhongcay/hailo_ws/chess_pieces_detection/runs/chess_detection_yolo11n-3/real_hailo_model     
hw_arch: "hailo8"                      # Hailo target architecture ('hailo8', 'hailo8l', etc.)
imgsz: 640                             # Input image size (square 640x640)
calib_count: 1024                        # Number of calibration images to load
device: "0"                            # Execution device ('gpu', '0', 'cpu', '-1')
# Custom end node names to trim ONNX graph
end_node_names:
  - "/model.23/cv2.0/cv2.0.2/Conv"
  - "/model.23/cv2.1/cv2.1.2/Conv"
  - "/model.23/cv2.2/cv2.2.2/Conv"
  - "/model.23/cv3.0/cv3.0.2/Conv"
  - "/model.23/cv3.1/cv3.1.2/Conv"
  - "/model.23/cv3.2/cv3.2.2/Conv"

# Custom model script command strings or file path
model_script: 
  - "normalization1 = normalization([0.0, 0.0, 0.0], [255.0, 255.0, 255.0])\n"
  - "nv12_to_rgb1 = input_conversion(nv12_to_rgb)\n"
  - "nms_postprocess(config_path=\"/home/duykhongcay/hailo_ws/chess_pieces_detection/runs/chess_detection_yolo11n-3/real_hailo_model/yolov11n_nms_config.json\", meta_arch=yolov8)\n"
  - "model_optimization_flavor(optimization_level=2, batch_size=1)\n"
  - "change_output_activation(conv54, sigmoid)\n"
  - "change_output_activation(conv65, sigmoid)\n"
  - "change_output_activation(conv80, sigmoid)\n"
  - "allocator_param(width_splitter_defuse=disabled)\n"
  - "performance_param(compiler_optimization_level=max)\n"

# Starting pipeline stage: 'all', 'optimize', 'quantize', 'compile'
stage: "compile"                                               

