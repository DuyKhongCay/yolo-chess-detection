# Training configuration for fine-tuning YOLOv11m on ChessRED using Draccus
data: datasets/dataset.yaml
model: yolo11m.pt
epochs: 1
batch: -1
imgsz: 640
device: '0'
project: models
name: yolo11m_chessred
patience: 15
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: true
mosaic: 1.0
mixup: 0.1
degrees: 15.0
scale: 0.5
fliplr: 0.5
flipud: 0.0
exist_ok: true
