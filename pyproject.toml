[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-pieces-detection"
version = "0.1.0"
description = "Chess piece detection, perspective transformation, and FEN generation pipeline using fine-tuned YOLOv11m"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "opencv-python>=4.8.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "tqdm>=4.65.0",
    "draccus>=0.8.0",
    "graphviz",
    "pygraphviz"
]


[project.optional-dependencies]
# Training dependencies for YOLOv11 model (Kaggle/Colab/Training PC)
train = [
    "ultralytics>=8.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

# Hailo Dataflow Compiler (DFC) dependencies for x86 Host PC (Model compilation & optimization)
dfc = [
    "tensorflow==2.18.0",
    "keras==3.5.0",
    "flatbuffers==24.3.25",
    "protobuf==3.20.3",
    "numpy==1.26.4",
]

[project.scripts]
chess-download = "scripts.chessred_download:download_chessred"
chess-train = "scripts.train:train"
chess-evaluate = "scripts.evaluate:evaluate"
chess-predict = "scripts.predict:main"
chess-export-hailo = "scripts.export_hailo_model:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
